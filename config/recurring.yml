# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # The clock for every screen. Ticks often; each display only advances once
  # its own cycle_seconds has elapsed, so the frequency here is granularity,
  # not cadence.
  rotate_displays:
    class: RotateDisplaysJob
    schedule: every minute

  # Keeps a copy of the collection that can be read without verso. Idempotent
  # by checksum, so all but the first run are nearly free — see
  # docs/adr/20260816-active-storage-with-round-trippable-export.md.
  export_artworks:
    class: ArtworkExportJob
    schedule: every day at 4am
